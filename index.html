<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北海道観光マスター検定 特訓演習アプリ</title>
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased select-none pb-12">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-sky-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🏔️</span>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-wider leading-tight">北海道観光マスター検定</h1>
          <p class="text-[11px] text-blue-200" id="bankSummaryLabel">公式テキスト完全準拠 実戦問題アプリ</p>
        </div>
      </div>
      <button onclick="confirmReset()" class="text-xs bg-white/10 hover:bg-white/20 active:bg-white/30 px-3 py-1.5 rounded-full transition text-blue-100 border border-white/20 flex items-center gap-1">
        <span>🔄</span> TOPへ
      </button>
    </div>
  </header>

  <!-- メイン -->
  <main class="max-w-3xl mx-auto px-3 sm:px-4 py-4 w-full flex-grow">

    <!-- 1. 設定 & モード選択画面 (TOP) -->
    <section id="configScreen" class="space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
        <div class="flex items-center justify-between border-b pb-3 mb-4">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <span>⚙️</span> 出題設定
          </h2>
          <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200" id="totalCountBadge">
            収録中: 0 問
          </span>
        </div>

        <!-- カテゴリ選択 -->
        <div class="mb-5">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">出題分野（チャプター）</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="categoryButtons"></div>
        </div>

        <!-- 出題問題数設定 -->
        <div class="mb-5">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">出題問題数</label>
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="setCountMode(20)" class="count-opt-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-700 hover:bg-blue-50 transition" data-count="20">20問<br><span class="text-[10px] text-slate-400 font-normal">隙間時間</span></button>
            <button type="button" onclick="setCountMode(50)" class="count-opt-btn active py-2.5 text-xs font-bold rounded-xl border-2 border-blue-600 bg-blue-50 text-blue-800 transition" data-count="50">50問 ⭐<br><span class="text-[10px] text-blue-600 font-normal">標準模試</span></button>
            <button type="button" onclick="setCountMode(100)" class="count-opt-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-700 hover:bg-blue-50 transition" data-count="100">100問<br><span class="text-[10px] text-slate-400 font-normal">ガッツリ</span></button>
            <button type="button" onclick="setCountMode('all')" class="count-opt-btn py-2.5 text-xs font-bold rounded-xl border border-purple-200 bg-purple-50 text-purple-800 hover:bg-purple-100 transition" data-count="all">全問走破 🚀<br><span class="text-[10px] text-purple-600 font-normal">全問モード</span></button>
          </div>
        </div>

        <button onclick="startQuiz()" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-base shadow-lg shadow-blue-500/30 active:scale-[0.99] transition flex items-center justify-center gap-2">
          <span id="startBtnText">ランダム演習をスタート (50問)</span>
        </button>

        <div class="bg-amber-50 border border-amber-200/70 rounded-xl p-3 flex items-start gap-2 text-xs text-amber-800 mb-5">
          <span class="text-base">🔀</span>
          <div>
            <p class="font-bold">選択肢シャッフル機能 稼働中</p>
            <p class="text-amber-700 leading-relaxed text-[11px]">5つの選択肢が毎回完全ランダムに並び替わります。位置の記憶ではなく確実な知識定着が可能です。</p>
          </div>
        </div>   
      </div>
    </section>

    <!-- 2. 演習画面 (Quiz Screen) -->
    <section id="quizScreen" class="hidden space-y-3">
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 sticky top-14 z-40">
        <div class="flex justify-between items-center text-xs font-bold mb-1.5">
          <span class="text-slate-500" id="quizProgressText">第 1 問 / 50 問</span>
          <div class="flex items-center gap-2">
            <span class="text-emerald-600">正解: <strong id="liveCorrect">0</strong></span>
            <span class="text-rose-500">ミス: <strong id="liveMistake">0</strong></span>
          </div>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 2%;"></div>
        </div>
      </div>

      <div id="questionCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
        <div class="flex items-center justify-between gap-2 mb-3">
          <span id="qCategoryBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 border border-blue-200">
            分野名
          </span>
          <span id="qNumberBadge" class="text-xs font-bold text-slate-400">Q.1</span>
        </div>

        <h3 id="questionText" class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-4">
          問題文
        </h3>

        <div id="choiceContainer" class="space-y-2.5"></div>

        <div id="feedbackBox" class="hidden mt-4 pt-4 border-t border-slate-200 space-y-3">
          <div id="resultStatus" class="p-3 rounded-xl flex items-center justify-between text-sm font-bold"></div>
          <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-200 text-xs text-slate-700 leading-relaxed">
            <p class="font-bold text-slate-900 mb-1 flex items-center gap-1">
              <span>📖</span> 公式テキスト解説
            </p>
            <p id="explanationText"></p>
          </div>
          <div class="flex gap-2">
            <a id="googleSearchBtn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 px-3 bg-white border border-slate-300 text-slate-700 font-bold rounded-xl text-xs hover:bg-slate-50 transition flex items-center justify-center gap-1.5 shadow-sm">
              <span>🔍</span> Googleで検索
            </a>
            <button onclick="nextQuestion()" class="flex-1 py-2.5 px-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-1">
              <span>次へ進む ➜</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 結果画面 (Result Screen) -->
    <section id="resultScreen" class="hidden space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center">
        <span class="text-5xl block mb-2" id="resultEmoji">🏆</span>
        <h2 class="text-xl font-black text-slate-900" id="resultTitle">演習完了！</h2>
        <p class="text-xs text-slate-500 mt-1 mb-4" id="resultSubtitle">お疲れ様でした！実力を振り返りましょう。</p>

        <div class="grid grid-cols-3 gap-2 bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4">
          <div>
            <div class="text-[10px] text-slate-400 font-bold">回答数</div>
            <div class="text-lg font-black text-slate-800" id="totalAnsweredCount">50</div>
          </div>
          <div>
            <div class="text-[10px] text-slate-400 font-bold">正解数</div>
            <div class="text-lg font-black text-emerald-600" id="finalCorrectCount">42</div>
          </div>
          <div>
            <div class="text-[10px] text-slate-400 font-bold">正答率</div>
            <div class="text-lg font-black text-blue-600" id="finalScoreRate">84%</div>
          </div>
        </div>

        <div id="passBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold mb-4">
          判定
        </div>

        <div class="flex flex-col sm:flex-row gap-2">
          <button onclick="restartQuiz()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl text-xs shadow-md hover:bg-blue-700 transition">
            🔄 もう一度シャッフルして解く
          </button>
          <button onclick="goToTop()" class="w-full py-3 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs hover:bg-slate-200 transition">
            ⚙️ 設定に戻る
          </button>
        </div>
      </div>

      <div id="mistakeSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <h3 class="text-sm font-bold text-slate-900 mb-3 flex items-center justify-between">
          <span class="flex items-center gap-1.5"><span>❌</span> 間違えた問題の振り返り (<span id="mistakeCountLabel">0</span>問)</span>
        </h3>
        <div id="mistakeList" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <!-- 外部問題データベースの読み込み -->
  <script src="questions.js"></script>

  <!-- アプリ本体の制御スクリプト -->
  <script>
    // questions.js が未読み込みまたは空の場合の安全策
    const QUESTIONS_DATA = (typeof QUESTIONS !== 'undefined' && Array.isArray(QUESTIONS)) ? QUESTIONS : [];

    let currentQuestions = [];
    let currentIdx = 0;
    let correctCount = 0;
    let mistakeCount = 0;
    let userAnswers = [];
    let selectedCategory = "all";
    let selectedCountMode = 50;

    const CATEGORIES = [
      { id: "all", name: "全分野（実戦模試）", icon: "🌐" },
      { id: "自然", name: "自然環境", icon: "🌲" },
      { id: "道南", name: "道南エリア", icon: "⚓" },
      { id: "道央", name: "道央エリア", icon: "🏙️" },
      { id: "道北", name: "道北エリア", icon: "🌾" },
      { id: "オホーツク", name: "オホーツク", icon: "🧊" },
      { id: "釧路・根室", name: "釧路・根室", icon: "🦅" },
      { id: "十勝", name: "十勝エリア", icon: "🥔" },
      { id: "歴史", name: "北海道の歴史", icon: "📜" },
      { id: "祭り", name: "イベント・祭り", icon: "🎆" },
      { id: "交通網", name: "交通機関・新幹線", icon: "🚅" },
      { id: "観光動向", name: "最新動向・統計", icon: "📈" }
    ];

    window.addEventListener("DOMContentLoaded", () => {
      renderCategoryButtons();
      updateTopSummary();
    });

    function renderCategoryButtons() {
      const container = document.getElementById("categoryButtons");
      container.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const count = cat.id === "all" ? QUESTIONS_DATA.length : QUESTIONS_DATA.filter(q => q.cat === cat.id).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
          selectedCategory === cat.id
            ? "border-blue-600 bg-blue-50 text-blue-900 font-bold shadow-sm"
            : "border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100"
        }`;
        btn.onclick = () => selectCategory(cat.id);
        btn.innerHTML = `
          <div class="flex items-center gap-1.5 text-xs">
            <span>${cat.icon}</span>
            <span class="truncate">${cat.name}</span>
          </div>
          <span class="text-[10px] text-slate-400 mt-1">${count} 問</span>
        `;
        container.appendChild(btn);
      });
    }

    function selectCategory(catId) {
      selectedCategory = catId;
      renderCategoryButtons();
      updateStartBtnText();
    }

    function setCountMode(mode) {
      selectedCountMode = mode;
      document.querySelectorAll(".count-opt-btn").forEach(btn => {
        if (btn.getAttribute("data-count") === String(mode)) {
          btn.className = "count-opt-btn active py-2.5 text-xs font-bold rounded-xl border-2 border-blue-600 bg-blue-50 text-blue-800 transition";
        } else {
          btn.className = "count-opt-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition";
        }
      });
      updateStartBtnText();
    }

    function updateTopSummary() {
      document.getElementById("totalCountBadge").textContent = `問題バンク収録: ${QUESTIONS_DATA.length} 問`;
      updateStartBtnText();
    }

    function updateStartBtnText() {
      const pool = selectedCategory === "all" ? QUESTIONS_DATA : QUESTIONS_DATA.filter(q => q.cat === selectedCategory);
      const count = selectedCountMode === "all" ? pool.length : Math.min(selectedCountMode, pool.length);
      const catObj = CATEGORIES.find(c => c.id === selectedCategory);
      const catName = catObj ? catObj.name : "全分野";
      document.getElementById("startBtnText").textContent = `演習スタート [${catName}・全${count}問]`;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startQuiz() {
      const pool = selectedCategory === "all" ? QUESTIONS_DATA : QUESTIONS_DATA.filter(q => q.cat === selectedCategory);
      if (pool.length === 0) {
        alert("選択されたカテゴリに問題がありません。questions.js に問題を追加してください。");
        return;
      }

      const shuffledPool = shuffle(pool);
      const limit = selectedCountMode === "all" ? shuffledPool.length : Math.min(selectedCountMode, shuffledPool.length);
      currentQuestions = shuffledPool.slice(0, limit);

      currentIdx = 0;
      correctCount = 0;
      mistakeCount = 0;
      userAnswers = [];

      document.getElementById("configScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");

      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      const q = currentQuestions[currentIdx];
      const total = currentQuestions.length;

      document.getElementById("quizProgressText").textContent = `第 ${currentIdx + 1} 問 / ${total} 問`;
      document.getElementById("liveCorrect").textContent = correctCount;
      document.getElementById("liveMistake").textContent = mistakeCount;
      document.getElementById("progressBar").style.width = `${((currentIdx + 1) / total) * 100}%`;

      document.getElementById("qCategoryBadge").textContent = q.cat;
      document.getElementById("qNumberBadge").textContent = `Q.${currentIdx + 1}`;
      document.getElementById("questionText").textContent = q.q;

      // 選択肢ランダムシャッフル
      const shuffledChoices = shuffle(q.c);
      const choiceContainer = document.getElementById("choiceContainer");
      choiceContainer.innerHTML = "";

      shuffledChoices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn w-full p-3 sm:p-3.5 text-left rounded-xl border border-slate-200 bg-slate-50 hover:bg-blue-50/60 active:bg-blue-100 text-sm sm:text-base font-semibold text-slate-800 transition flex items-start gap-2.5 shadow-sm";
        btn.onclick = () => handleChoice(choice, btn);
        btn.innerHTML = `
          <span class="w-5 h-5 rounded-full bg-white border border-slate-300 text-slate-500 text-[11px] font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${index + 1}</span>
          <span class="flex-grow leading-relaxed">${choice}</span>
        `;
        choiceContainer.appendChild(btn);
      });

      document.getElementById("feedbackBox").classList.add("hidden");
    }

    function handleChoice(selectedText, clickedBtn) {
      const q = currentQuestions[currentIdx];
      const isCorrect = (selectedText === q.ans);

      const buttons = document.querySelectorAll(".choice-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        const btnText = btn.querySelector(".flex-grow").textContent;
        if (btnText === q.ans) {
          btn.className = "w-full p-3 sm:p-3.5 text-left rounded-xl border-2 border-emerald-500 bg-emerald-50 text-sm sm:text-base font-bold text-emerald-900 transition flex items-start gap-2.5 shadow-sm";
          btn.querySelector(".w-5").className = "w-5 h-5 rounded-full bg-emerald-600 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0 mt-0.5";
          btn.querySelector(".w-5").innerHTML = "✓";
        } else if (btn === clickedBtn && !isCorrect) {
          btn.className = "w-full p-3 sm:p-3.5 text-left rounded-xl border-2 border-rose-500 bg-rose-50 text-sm sm:text-base font-bold text-rose-900 transition flex items-start gap-2.5 shadow-sm";
          btn.querySelector(".w-5").className = "w-5 h-5 rounded-full bg-rose-600 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0 mt-0.5";
          btn.querySelector(".w-5").innerHTML = "✕";
        } else {
          btn.classList.add("opacity-50");
        }
      });

      if (isCorrect) {
        correctCount++;
      } else {
        mistakeCount++;
      }
      userAnswers.push({ q, selectedText, isCorrect });

      const statusBox = document.getElementById("resultStatus");
      if (isCorrect) {
        statusBox.className = "p-3 rounded-xl flex items-center justify-between text-sm font-bold bg-emerald-100 text-emerald-800 border border-emerald-200";
        statusBox.innerHTML = `<span>⭕ 正解！</span> <span class="text-xs font-normal">正答率: ${Math.round((correctCount / (currentIdx + 1)) * 100)}%</span>`;
      } else {
        statusBox.className = "p-3 rounded-xl flex items-center justify-between text-sm font-bold bg-rose-100 text-rose-800 border border-rose-200";
        statusBox.innerHTML = `<span>❌ 残念！不正解</span> <span class="text-xs">正解: <strong>${q.ans}</strong></span>`;
      }

      document.getElementById("explanationText").textContent = q.exp;
      document.getElementById("googleSearchBtn").href = `https://www.google.com/search?q=${encodeURIComponent(q.ans + " 北海道観光")}`;
      document.getElementById("feedbackBox").classList.remove("hidden");
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < currentQuestions.length) {
        renderCurrentQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quizScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.remove("hidden");

      const total = currentQuestions.length;
      const rate = Math.round((correctCount / total) * 100);

      document.getElementById("totalAnsweredCount").textContent = total;
      document.getElementById("finalCorrectCount").textContent = correctCount;
      document.getElementById("finalScoreRate").textContent = `${rate}%`;

      const passBadge = document.getElementById("passBadge");
      const emoji = document.getElementById("resultEmoji");
      const title = document.getElementById("resultTitle");

      if (rate >= 85) {
        emoji.textContent = "🥇";
        title.textContent = "観光マスター級！合格圏内！";
        passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300";
        passBadge.textContent = "判定: S判定（本番合格確実圏）";
      } else if (rate >= 70) {
        emoji.textContent = "🎉";
        title.textContent = "合格ライン（70%）突破！";
        passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800 border border-blue-300";
        passBadge.textContent = "判定: A判定（合格圏内）";
      } else {
        emoji.textContent = "💪";
        title.textContent = "あと一歩！間違えた問題を復習！";
        passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300";
        passBadge.textContent = "判定: 要復習（合格基準70%以上）";
      }

      const mistakes = userAnswers.filter(a => !a.isCorrect);
      document.getElementById("mistakeCountLabel").textContent = mistakes.length;
      const mistakeList = document.getElementById("mistakeList");
      mistakeList.innerHTML = "";

      if (mistakes.length === 0) {
        mistakeList.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 bg-slate-50 rounded-xl">ミスはありません！全問正解です！</div>`;
      } else {
        mistakes.forEach(m => {
          const item = document.createElement("div");
          item.className = "p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xs space-y-1.5";
          item.innerHTML = `
            <div class="font-bold text-slate-900 leading-snug">${m.q.q}</div>
            <div class="flex items-center gap-2 text-[11px]">
              <span class="text-rose-600 font-bold">あなたの回答: ${m.selectedText}</span>
              <span class="text-slate-300">|</span>
              <span class="text-emerald-700 font-bold">正解: ${m.q.ans}</span>
            </div>
            <p class="text-slate-600 text-[11px] leading-relaxed pt-1 border-t border-slate-200">${m.q.exp}</p>
            <div class="pt-1">
              <a href="https://www.google.com/search?q=${encodeURIComponent(m.q.ans + ' 北海道観光')}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline font-bold text-[10px] inline-flex items-center gap-1">
                🔍 「${m.q.ans}」をGoogle検索
              </a>
            </div>
          `;
          mistakeList.appendChild(item);
        });
      }
    }

    function restartQuiz() {
      startQuiz();
    }

    function goToTop() {
      document.getElementById("resultScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.add("hidden");
      document.getElementById("configScreen").classList.remove("hidden");
      updateTopSummary();
    }

    function confirmReset() {
      if (document.getElementById("quizScreen").classList.contains("hidden")) {
        goToTop();
        return;
      }
